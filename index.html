
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Jembatan Aluang Saiyo</title>

<!-- Library Model Viewer -->
<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #eef1f5;
}

header {
    background: #142b4a;
    color: white;
    padding: 20px;
}

header h2 {
    margin: 0;
}

model-viewer {
    display: block;
    width: 100%;
    height: 75vh;
    min-height: 400px;
    background: white;
}

#status {
    padding: 15px;
    font-size: 14px;
    white-space: pre-wrap;
    line-height: 1.6;
}

.ar-button {
    background: #142b4a;
    color: white;
    padding: 14px 22px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

footer {
    padding: 15px;
    color: #555;
}

</style>
</head>

<body>

<header>
    <h2>AR Jembatan Aluang Saiyo</h2>
    <p>Visualisasi 3D dan Augmented Reality</p>
</header>

<model-viewer
    id="bridge"
    src="Jembatan.glb"
    alt="Model 3D Jembatan Aluang Saiyo"

    camera-controls
    auto-rotate
    touch-action="pan-y"

    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"

    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="auto">

    <button slot="ar-button" class="ar-button">
        LIHAT JEMBATAN DALAM AR
    </button>

</model-viewer>

<div id="status">
    Sedang memeriksa file GLB...
</div>

<footer>
    <p>AR Jembatan Aluang Saiyo</p>
    <p>Visualisasi Model Infrastruktur 3D</p>
</footer>

<script>
const bridge = document.getElementById("bridge");
const status = document.getElementById("status");

const modelPath = "./Jembatan.glb";

// Memeriksa keberadaan file GLB
async function checkModel() {

    try {

        const response = await fetch(modelPath, {
            method: "HEAD",
            cache: "no-store"
        });

        if (!response.ok) {

            status.textContent =
                "FILE GLB TIDAK DITEMUKAN!\n" +
                "HTTP Status: " + response.status +
                "\nPeriksa nama dan lokasi file GLB.";

            return;
        }

        const size =
            response.headers.get("content-length");

        status.textContent =
            "FILE GLB DITEMUKAN!\n" +
            "Status: " + response.status +
            "\nUkuran: " +
            (size
                ? (Number(size) / 1048576).toFixed(2) + " MB"
                : "Tidak diketahui") +
            "\nSedang memuat model 3D...";

    } catch (error) {

        status.textContent =
            "GAGAL MEMERIKSA FILE!\n" +
            error.message;

    }
}

// Jika model berhasil dimuat
bridge.addEventListener("load", () => {

    status.textContent =
        "BERHASIL!\n" +
        "Model 3D Jembatan Aluang Saiyo berhasil dimuat.";

});

// Jika model gagal dimuat
bridge.addEventListener("error", () => {

    status.textContent =
        "MODEL 3D GAGAL DIMUAT!\n" +
        "File mungkin rusak atau format GLB tidak valid.";

});

checkModel();
</script>

</body>
</html>
