
<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Jembatan Aluang Saiyo</title>

<!-- ================================= -->
<!-- 1. KONFIGURASI MES HOPT DECODER -->
<!-- ================================= -->

<script>
self.ModelViewerElement =
self.ModelViewerElement || {};

self.ModelViewerElement.meshoptDecoderLocation =
"https://cdn.jsdelivr.net/npm/meshoptimizer/meshopt_decoder.js";
</script>

<!-- ================================= -->
<!-- 2. GOOGLE MODEL VIEWER VERSI 4.4.0 -->
<!-- ================================= -->

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
</script>

<!-- ================================= -->
<!-- 3. CSS DESIGN -->
<!-- ================================= -->

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    text-align: center;
}

header {
    background: #142b4a;
    color: white;
    padding: 22px 10px;
}

header h2 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin-bottom: 0;
}

.container {
    padding: 15px;
}

model-viewer {
    display: block;
    width: 100%;
    height: 72vh;
    min-height: 400px;
    background: #ffffff;
    border-radius: 12px;
}

#status {
    padding: 15px;
    font-size: 14px;
    color: #142b4a;
    line-height: 1.7;
    white-space: pre-wrap;
}

.ar-button {
    background: #142b4a;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.ar-button:hover {
    background: #24558a;
}

footer {
    background: #142b4a;
    color: white;
    padding: 15px;
    margin-top: 20px;
}

@media (max-width: 600px) {

    header h2 {
        font-size: 20px;
    }

    model-viewer {
        height: 65vh;
        min-height: 350px;
    }

}

</style>

</head>

<body>

<!-- ================================= -->
<!-- 4. HEADER -->
<!-- ================================= -->

<header>

<h2>AR Jembatan Aluang Saiyo</h2>

<p>Visualisasi 3D dan Augmented Reality</p>

</header>


<!-- ================================= -->
<!-- 5. MODEL 3D -->
<!-- ================================= -->

<div class="container">

<model-viewer

    id="bridge"

    alt="Model 3D Jembatan Aluang Saiyo"

    camera-controls
    touch-action="pan-y"

    auto-rotate
    rotation-per-second="15deg"

    loading="eager"
    reveal="auto"

    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"

    shadow-intensity="1"
    exposure="1"

    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"
    ar-scale="auto"

    interaction-prompt="auto"

>

    <button
        slot="ar-button"
        class="ar-button">

        LIHAT JEMBATAN DALAM AR

    </button>

</model-viewer>


<!-- ================================= -->
<!-- 6. STATUS PEMUATAN -->
<!-- ================================= -->

<div id="status">

Memulai sistem AR Jembatan Aluang Saiyo...

</div>

</div>


<!-- ================================= -->
<!-- 7. FOOTER -->
<!-- ================================= -->

<footer>

<p>AR Jembatan Aluang Saiyo</p>

<p>Visualisasi Infrastruktur 3D</p>

</footer>


<!-- ================================= -->
<!-- 8. JAVASCRIPT TERBARU -->
<!-- ================================= -->

<script>

// =================================
// GOOGLE DRIVE CONFIGURATION
// =================================

const DRIVE_FILE_ID =
"161WMZ0q9zWmOAK138XJ7yRxU-SI6xiI4";

// URL FILE GLB GOOGLE DRIVE

const MODEL_URL =
"https://drive.google.com/uc?export=download&id="
+ DRIVE_FILE_ID;


// =================================
// ELEMENT HTML
// =================================

const bridge =
document.getElementById("bridge");

const status =
document.getElementById("status");

let modelLoaded = false;
let loadTimeout;


// =================================
// FUNGSI STATUS
// =================================

function updateStatus(message) {

    status.textContent = message;

}


// =================================
// MEMUAT MODEL 3D
// =================================

async function loadBridge() {

    try {

        updateStatus(
            "Menghubungkan ke Google Drive...\n" +
            "Mohon tunggu."
        );

        // Menunggu library Model Viewer

        await customElements.whenDefined(
            "model-viewer"
        );

        updateStatus(
            "Library 3D berhasil dimuat.\n" +
            "Mengambil model Jembatan Aluang Saiyo..."
        );

        // Memulai pemuatan model

        bridge.src = MODEL_URL;

        // Batas waktu diagnostik

        clearTimeout(loadTimeout);

        loadTimeout = setTimeout(() => {

            if (!modelLoaded) {

                updateStatus(
                    "PEMUATAN BELUM BERHASIL.\n\n" +
                    "Model belum berhasil dirender.\n" +
                    "Periksa Console browser dengan menekan F12.\n\n" +
                    "Kemungkinan masalah:\n" +
                    "1. Akses Google Drive / CORS.\n" +
                    "2. Meshopt Decoder.\n" +
                    "3. Tekstur WebP.\n" +
                    "4. Struktur file GLB."
                );

                console.warn(
                    "Model belum berhasil dimuat dalam 30 detik."
                );

            }

        }, 30000);

    }

    catch (error) {

        updateStatus(
            "GAGAL MEMULAI MODEL 3D:\n" +
            error.message
        );

        console.error(
            "INITIALIZATION ERROR:",
            error
        );

    }

}


// =================================
// PROGRESS PEMUATAN
// =================================

bridge.addEventListener("progress", (event) => {

    const progress = Math.round(
        event.detail.totalProgress * 100
    );

    if (!modelLoaded) {

        updateStatus(
            "SEDANG MEMUAT MODEL JEMBATAN\n\n" +
            "Progress: " + progress + "%\n" +
            "Sedang memproses geometri dan tekstur..."
        );

    }

    console.log(
        "MODEL PROGRESS:",
        progress + "%"
    );

});


// =================================
// MODEL BERHASIL DIMUAT
// =================================

bridge.addEventListener("load", (event) => {

    modelLoaded = true;

    clearTimeout(loadTimeout);

    updateStatus(
        "BERHASIL!\n\n" +
        "Model 3D Jembatan Aluang Saiyo berhasil dimuat.\n\n" +
        "Silakan putar dan perbesar model."
    );

    console.log(
        "MODEL BERHASIL DIMUAT:",
        event.detail
    );

    console.log(
        "MODEL LOADED:",
        bridge.loaded
    );

    console.log(
        "MODEL VISIBLE:",
        bridge.modelIsVisible
    );

});


// =================================
// MODEL GAGAL DIMUAT
// =================================

bridge.addEventListener("error", (event) => {

    modelLoaded = false;

    clearTimeout(loadTimeout);

    const errorType =
        event.detail?.type || "Tidak diketahui";

    const errorDetail =
        event.detail?.sourceError?.message ||
        event.detail?.sourceError ||
        "Tidak tersedia";

    updateStatus(
        "MODEL GAGAL DIMUAT!\n\n" +
        "Jenis kesalahan: " + errorType +
        "\nDetail: " + errorDetail +
        "\n\nPeriksa file GLB, Google Drive, " +
        "CORS, decoder, dan tekstur."
    );

    console.error(
        "MODEL VIEWER ERROR:",
        event.detail
    );

});


// =================================
// PEMERIKSAAN VISUAL MODEL
// =================================

bridge.addEventListener("model-visibility", (event) => {

    console.log(
        "MODEL VISIBILITY:",
        event.detail
    );

});


// =================================
// STATUS AUGMENTED REALITY
// =================================

bridge.addEventListener("ar-status", (event) => {

    console.log(
        "AR STATUS:",
        event.detail.status
    );

});


// =================================
// INISIALISASI WEBSITE
// =================================

loadBridge();

</script>

</body>
</html>
