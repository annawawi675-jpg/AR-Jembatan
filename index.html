
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Jembatan Aluang Saiyo</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js>
</script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #eef1f5;
}

header {
    background: #142b4a;
    color: white;
    padding: 20px;
}

model-viewer {
    display: block;
    width: 100%;
    height: 75vh;
    background: #ffffff;
}

#status {
    padding: 15px;
    white-space: pre-wrap;
    font-size: 14px;
}

button {
    background: #142b4a;
    color: white;
    padding: 14px 22px;
    border: none;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h2>AR Jembatan Aluang Saiyo</h2>
    <p>Visualisasi 3D dan Augmented Reality</p>
</header>

<model-viewer
    id="bridge"
    src="./Jembatan.glb"
    camera-controls
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"
    shadow-intensity="1"
    exposure="1"
    alt="Jembatan Aluang Saiyo">

    <button slot="ar-button">
        LIHAT JEMBATAN DALAM AR
    </button>

</model-viewer>

<div id="status">Sedang memeriksa file...</div>

<script>
const bridge = document.getElementById("bridge");
const status = document.getElementById("status");

async function checkModel() {
    try {
        const response = await fetch("./Jembatan.glb", {
            method: "HEAD",
            cache: "no-store"
        });

        const size = response.headers.get("content-length");
        const type = response.headers.get("content-type");

        if (!response.ok) {
            status.textContent =
                "GAGAL: File GLB tidak ditemukan.\n" +
                "HTTP Status: " + response.status;
            return;
        }

        status.textContent =
            "File GLB ditemukan!\n" +
            "HTTP Status: " + response.status + "\n" +
            "Ukuran: " +
            (size ? (Number(size) / 1048576).toFixed(2)
            + " MB" : "Tidak diketahui") +
            "\nTipe: " + (type || "Tidak diketahui") +
            "\nSedang memuat model 3D...";

    } catch (error) {
        status.textContent =
            "GAGAL MEMERIKSA FILE:\n" + error.message;
    }
}

bridge.addEventListener("load", () => {
    status.textContent =
        "BERHASIL! Model 3D Jembatan berhasil dimuat.";
});

bridge.addEventListener("error", () => {
    status.textContent =
        "File ditemukan atau sedang diperiksa, " +
        "tetapi model 3D gagal diproses.\n" +
        "Periksa validitas file GLB dan Console browser.";
});

checkModel();
</script>

</body>
</html>
