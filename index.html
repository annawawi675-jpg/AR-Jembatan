
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Jembatan Aluang Saiyo</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer@4.4.0/dist/model-viewer.min.js">
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    text-align: center;
}

header {
    background: #142b4a;
    color: white;
    padding: 20px;
}

header h2 {
    margin: 0;
}

model-viewer {
    width: 100%;
    height: 75vh;
    min-height: 400px;
    display: block;
    background: #e5eaf0;
}

#status {
    padding: 18px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.7;
}

.ar-button {
    background: #142b4a;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 14px 22px;
    font-size: 15px;
}

</style>
</head>

<body>

<header>
    <h2>AR Jembatan Aluang Saiyo</h2>
    <p>Visualisasi 3D dan Augmented Reality</p>
</header>

<model-viewer
    id="bridge"
    src="./Jembatan.glb"
    alt="Model 3D Jembatan Aluang Saiyo"

    camera-controls
    auto-rotate
    loading="eager"
    reveal="auto"

    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"

    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"

    shadow-intensity="1"
    exposure="1"
    interaction-prompt="auto">

    <button slot="ar-button" class="ar-button">
        LIHAT JEMBATAN DALAM AR
    </button>

</model-viewer>

<div id="status">
Memulai pemeriksaan...
</div>

<script>

const bridge = document.getElementById("bridge");
const status = document.getElementById("status");

function show(message) {
    status.textContent = message;
}

// Memeriksa apakah library berhasil dimuat
async function initialize() {

    try {

        show("Memuat library 3D...");

        await customElements.whenDefined("model-viewer");

        show("Library berhasil dimuat.\nMemeriksa file GLB...");

        const response = await fetch("./Jembatan.glb", {
            method: "HEAD",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "File GLB tidak ditemukan. HTTP " +
                response.status
            );
        }

        show(
            "File GLB berhasil ditemukan.\n" +
            "Ukuran: " +
            (
                response.headers.get("content-length")
                ? (
                    Number(response.headers.get("content-length"))
                    / 1048576
                  ).toFixed(2) + " MB"
                : "Tidak diketahui"
            ) +
            "\nMemproses model 3D..."
        );

    } catch (error) {

        show("PEMERIKSAAN GAGAL:\n" + error.message);

    }

}

// Progress pemuatan model
bridge.addEventListener("progress", (event) => {

    const progress =
        Math.round(event.detail.totalProgress * 100);

    show("Sedang memuat model 3D: " + progress + "%");

});

// Jika berhasil
bridge.addEventListener("load", () => {

    show(
        "BERHASIL!\n\n" +
        "Model Jembatan Aluang Saiyo berhasil dimuat.\n" +
        "Silakan putar dan perbesar model."
    );

});

// Jika gagal
bridge.addEventListener("error", (event) => {

    show(
        "MODEL GAGAL DIMUAT!\n\n" +
        "Detail kesalahan: " +
        (event.detail?.type || "Tidak diketahui") +
        "\nPeriksa format dan struktur file GLB."
    );

});

// Jalankan pemeriksaan
initialize();

</script>

</body>
</html>
