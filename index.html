
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Jembatan Aluang Saiyo</title>

    <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef1f5;
            text-align: center;
        }

        header {
            background: #142b4a;
            color: white;
            padding: 18px;
        }

        h2 {
            margin: 0;
        }

        p {
            font-size: 14px;
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background: white;
        }

        .info {
            padding: 15px;
        }

        #status {
            color: #333;
            font-size: 14px;
        }

        button {
            background: #142b4a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h2>AR Jembatan Aluang Saiyo</h2>
    <p>Visualisasi 3D dan Augmented Reality</p>
</header>

<model-viewer
    id="bridge"
    src="PBS baru 1-compressed-compressedE.glb"
    camera-controls
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"
    shadow-intensity="1"
    exposure="1"
    alt="Model 3D Jembatan Aluang Saiyo">

    <button slot="ar-button">
        LIHAT JEMBATAN DALAM AR
    </button>

</model-viewer>

<div class="info">
    <p id="status">Memuat model 3D jembatan...</p>
    <p>Geser untuk memutar model dan gunakan zoom untuk memperbesar.</p>
</div>

<script>
    const bridge = document.getElementById("bridge");
    const status = document.getElementById("status");

    bridge.addEventListener("load", () => {
        status.textContent = "Model 3D berhasil dimuat!";
    });

    bridge.addEventListener("error", () => {
        status.textContent =
        "Model gagal dimuat. Periksa nama dan lokasi file GLB.";
    });
</script>

</body>
</html>
