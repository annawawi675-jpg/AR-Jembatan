
<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Jembatan Aluang Saiyo</title>

<!-- ================================= -->
<!-- MES HOPT DECODER CONFIGURATION -->
<!-- ================================= -->

<script>
window.ModelViewerElement =
window.ModelViewerElement || {};

window.ModelViewerElement.meshoptDecoderLocation =
"https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js";
</script>

<!-- ================================= -->
<!-- GOOGLE MODEL VIEWER -->
<!-- ================================= -->

<script type="module"
src="https://unpkg.com/@google/model-viewer@4.4.0/dist/model-viewer.min.js">
</script>

<!-- ================================= -->
<!-- CSS DESIGN -->
<!-- ================================= -->

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    text-align: center;
}

header {
    background: #142b4a;
    color: white;
    padding: 22px 10px;
}

header h2 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin-bottom: 0;
}

.container {
    padding: 15px;
}

model-viewer {
    display: block;
    width: 100%;
    height: 72vh;
    min-height: 400px;
    background: #ffffff;
    border-radius: 12px;
}

#status {
    padding: 15px;
    font-size: 14px;
    color: #142b4a;
    line-height: 1.7;
    white-space: pre-wrap;
}

.ar-button {
    background: #142b4a;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.ar-button:hover {
    background: #24558a;
}

footer {
    background: #142b4a;
    color: white;
    padding: 15px;
    margin-top: 20px;
}

@media (max-width: 600px) {

    header h2 {
        font-size: 20px;
    }

    model-viewer {
        height: 65vh;
        min-height: 350px;
    }

}

</style>

</head>

<body>

<!-- ================================= -->
<!-- HEADER -->
<!-- ================================= -->

<header>

<h2>AR Jembatan Aluang Saiyo</h2>

<p>Visualisasi 3D dan Augmented Reality</p>

</header>


<!-- ================================= -->
<!-- MODEL 3D -->
<!-- ================================= -->

<div class="container">

<model-viewer
    id="bridge"

    alt="Model 3D Jembatan Aluang Saiyo"

    crossorigin="anonymous"

    camera-controls
    auto-rotate
    loading="eager"

    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"

    shadow-intensity="1"
    exposure="1"

    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor">

    <button
        slot="ar-button"
        class="ar-button">

        LIHAT JEMBATAN DALAM AR

    </button>

</model-viewer>


<!-- ================================= -->
<!-- STATUS PEMUATAN -->
<!-- ================================= -->

<div id="status">
Memulai sistem AR Jembatan Aluang Saiyo...
</div>

</div>


<!-- ================================= -->
<!-- FOOTER -->
<!-- ================================= -->

<footer>

<p>AR Jembatan Aluang Saiyo</p>

<p>Visualisasi Infrastruktur 3D</p>

</footer>


<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script>

// =================================
// GOOGLE DRIVE CONFIGURATION
// =================================

const DRIVE_FILE_ID =
"161WMZ0q9zWmOAK138XJ7yRxU-SI6xiI4";

// Link download langsung Google Drive

const MODEL_URL =
"https://drive.google.com/uc?export=download&id="
+ DRIVE_FILE_ID;


// =================================
// ELEMENT HTML
// =================================

const bridge =
document.getElementById("bridge");

const status =
document.getElementById("status");


// =================================
// LOAD MODEL
// =================================

async function loadBridge() {

    try {

        status.textContent =
        "Menghubungkan ke Google Drive...";

        await customElements.whenDefined("model-viewer");

        status.textContent =
        "Library 3D berhasil dimuat.\n" +
        "Menghubungkan model jembatan...";

        bridge.src = MODEL_URL;

    }

    catch (error) {

        status.textContent =
        "GAGAL MEMULAI MODEL 3D:\n" +
        error.message;

    }

}


// =================================
// PROGRESS PEMUATAN
// =================================

bridge.addEventListener("progress", (event) => {

    const progress = Math.round(
        event.detail.totalProgress * 100
    );

    status.textContent =
    "Sedang memuat model jembatan: "
    + progress + "%";

});


// =================================
// MODEL BERHASIL DIMUAT
// =================================

bridge.addEventListener("load", () => {

    status.textContent =
    "BERHASIL!\n\n" +
    "Model 3D Jembatan Aluang Saiyo berhasil dimuat.";

});


// =================================
// MODEL GAGAL DIMUAT
// =================================

bridge.addEventListener("error", (event) => {

    status.textContent =
    "MODEL GAGAL DIMUAT!\n\n" +
    "Periksa akses Google Drive, CORS, " +
    "format GLB, dan kompatibilitas tekstur.\n" +
    "Detail: " +
    (event.detail?.type || "Tidak diketahui");

});


// =================================
// INITIALIZE
// =================================

loadBridge();

</script>

</body>
</html>

</script>

</body>
</html>
