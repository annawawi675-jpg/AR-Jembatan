
<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AR Jembatan Aluang Saiyo</title>

<!-- Meshopt Decoder -->
<script>
window.ModelViewerElement =
window.ModelViewerElement || {};

window.ModelViewerElement.meshoptDecoderLocation =
"https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js";
</script>

<!-- Google Model Viewer -->
<script type="module"
src="https://unpkg.com/@google/model-viewer@4.4.0/dist/model-viewer.min.js">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    text-align: center;
}

header {
    background: #142b4a;
    color: white;
    padding: 22px 10px;
}

header h2 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin-bottom: 0;
}

.container {
    padding: 15px;
}

model-viewer {
    width: 100%;
    height: 72vh;
    min-height: 400px;
    background: #ffffff;
    border-radius: 12px;
}

#status {
    padding: 15px;
    font-size: 14px;
    color: #142b4a;
    line-height: 1.6;
    white-space: pre-wrap;
}

.ar-button {
    background: #142b4a;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.ar-button:hover {
    background: #24558a;
}

footer {
    background: #142b4a;
    color: white;
    padding: 15px;
    margin-top: 20px;
}

</style>
</head>

<body>

<header>

<h2>AR Jembatan Aluang Saiyo</h2>

<p>Visualisasi 3D dan Augmented Reality</p>

</header>

<div class="container">

<model-viewer
    id="bridge"

    alt="Model 3D Jembatan Aluang Saiyo"

    camera-controls
    auto-rotate
    loading="eager"

    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"

    shadow-intensity="1"
    exposure="1"

    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor">

    <button
        slot="ar-button"
        class="ar-button">

        LIHAT JEMBATAN DALAM AR

    </button>

</model-viewer>

<div id="status">
Memulai sistem AR...
</div>

</div>

<footer>

<p>AR Jembatan Aluang Saiyo</p>
<p>Visualisasi Infrastruktur 3D</p>

</footer>

<script>

// =================================
// GOOGLE DRIVE CONFIGURATION
// =================================

// Ganti dengan ID file Google Drive kamu

const DRIVE_FILE_ID = "161WMZ0q9zWmOAK138XJ7yRxU-SI6xiI4";

// Link download langsung Google Drive

const MODEL_URL =
"https://drive.google.com/file/d/161WMZ0q9zWmOAK138XJ7yRxU-SI6xiI4/view?usp=drive_link"
+ DRIVE_FILE_ID;


// =================================
// MODEL VIEWER
// =================================

const bridge =
document.getElementById("bridge");

const status =
document.getElementById("status");


// =================================
// LOAD MODEL
// =================================

async function loadBridge() {

    if (
        DRIVE_FILE_ID === "MASUKKAN_ID_GOOGLE_DRIVE"
    ) {

        status.textContent =
        "Silakan masukkan ID Google Drive terlebih dahulu.";

        return;

    }

    status.textContent =
    "Sedang menghubungkan ke Google Drive...";

    bridge.src = MODEL_URL;

}


// =================================
// PROGRESS
// =================================

bridge.addEventListener("progress", (event) => {

    const progress = Math.round(
        event.detail.totalProgress * 100
    );

    status.textContent =
    "Sedang memuat model jembatan: "
    + progress + "%";

});


// =================================
// MODEL LOADED
// =================================

bridge.addEventListener("load", () => {

    status.textContent =
    "BERHASIL!\n" +
    "Model 3D Jembatan Aluang Saiyo berhasil dimuat.";

});


// =================================
// MODEL ERROR
// =================================

bridge.addEventListener("error", (event) => {

    status.textContent =
    "MODEL GAGAL DIMUAT!\n\n" +
    "Periksa izin Google Drive, CORS, " +
    "format GLB, dan kompatibilitas tekstur.\n" +
    "Detail: " +
    (event.detail?.type || "Tidak diketahui");

});


// =================================
// INITIALIZE
// =================================

customElements.whenDefined("model-viewer")
.then(() => {

    loadBridge();

});

</script>

</body>
</html>
